<!doctype html>
<meta charset="utf-8">
<title>engine-webgpu</title>
<script type="module">
  import { run } from './harness.js';
  import { engineSuite } from './engine-suite.js';
  run(async () => {
    if (!navigator.gpu) return { skipped: 'no webgpu' };
    const { createWebGPUEngine } = await import('../../js/engine/webgpu.js');
    const engine = await createWebGPUEngine();
    if (!engine) return { skipped: 'no webgpu adapter' };
    try { return await engineSuite(engine); } finally { engine.dispose(); }
  });
</script>

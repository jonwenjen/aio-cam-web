<!doctype html>
<meta charset="utf-8">
<title>engine-webgl2</title>
<script type="module">
  import { run } from './harness.js';
  import { engineSuite } from './engine-suite.js';
  import { createWebGL2Engine } from '../../js/engine/webgl2.js';
  run(async () => {
    const engine = await createWebGL2Engine();
    if (!engine) return { pass: false, error: 'WebGL2 unavailable' };
    try { return await engineSuite(engine); } finally { engine.dispose(); }
  });
</script>

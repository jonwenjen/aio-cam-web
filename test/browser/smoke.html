<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<script type="module">
  import { run, toImageData } from './harness.js';
  import { makeSynthetic, SYNTHETIC_NAMES } from './synthetic.js';
  run(async () => {
    const sizes = {};
    for (const name of SYNTHETIC_NAMES) {
      const img = toImageData(makeSynthetic(name));
      sizes[name] = [img.width, img.height, img.colorSpace];
    }
    return { sizes, webgpu: !!navigator.gpu };
  });
</script>

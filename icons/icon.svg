<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 抽象光圈：六角形開口＋六片葉片的分隔線。全幅黑底，圖形在中央 60% 安全區內（maskable）。 -->
  <defs><clipPath id="lens"><circle r="150"/></clipPath></defs>
  <rect width="512" height="512" fill="#000"/>
  <g transform="translate(256 256)">
    <circle r="150" fill="#ffcc33"/>
    <g clip-path="url(#lens)" stroke="#111" stroke-width="9" stroke-linecap="round">
      <line x1="50.2" y1="-29.0" x2="50.2" y2="231.0"/>
      <line x1="50.2" y1="29.0" x2="-174.9" y2="159.0"/>
      <line x1="0.0" y1="58.0" x2="-225.2" y2="-72.0"/>
      <line x1="-50.2" y1="29.0" x2="-50.2" y2="-231.0"/>
      <line x1="-50.2" y1="-29.0" x2="174.9" y2="-159.0"/>
      <line x1="-0.0" y1="-58.0" x2="225.2" y2="72.0"/>
    </g>
    <path d="M50.2 -29.0 L50.2 29.0 L0.0 58.0 L-50.2 29.0 L-50.2 -29.0 L-0.0 -58.0 Z" fill="#111"/>
  </g>
</svg>
